trust-remote-code: true
enforce-eager: true
num-gpus: 1
task-type: ref2va
usp: 1
use-hsdp: false
text-encoder-tp-size: 1
vae-patch-parallel-size: 1
vae-parallel-mode: tile
vae-use-tiling: true
diffusion-attention-config:
  default:
    backend: FASTVIDEO_VSA
    fastvideo_vsa_provider: flashinfer
    fastvideo_vsa_precision: sage
enable-diffusion-pipeline-profiler: true
default-sampling-params:
  '0':
    num_inference_steps: 8
    guidance_scale: 1
init-timeout: 3600
stage-init-timeout: 3600
additional-config:
  video_vae_decoder: null
diffusion-offload-config:
  mode: layer
  components:
  - dit
  - text_encoder
  layer_options:
    dit:
      resident_layers: 1
      weight_transfer: rank-local
    text_encoder:
      weight_transfer: rank-local
  pin_memory: true
